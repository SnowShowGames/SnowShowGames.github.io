<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calculator {
            max-width:500px;
            margin:50px auto;
            padding:30px;
            background:#dbd19a;
            border-radius:10px;
            box-shadow:0 4px 6px rgba(0,0,0,0.1);
        }
        #result {
            font-size:1.5rem;
            font-weight:bold;
            color:#f3cbcb;
            margin-top:20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <h2 class="text-center mb-4">Калькулятор заказа</h2>
            <div class="mb-3">
                <label for="productSelect" class="form-label">Выберите товар</label>
                <select id="productSelect" class="form-select">
                    <option value="0">---Выберите товар---</option>
                    <option value="350">Клавиатура (350 руб.)</option>
                    <option value="300">Компьютерная мышь (300 руб.)</option>
                    <option value="4500">Монитор (4500 руб.)</option>
                    <option value="250">Ковёр для мыши (250 руб.)</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="quantityInput" class="form-label">Количество:</label>
                <input type="number" id="quantityInput" class="form-control" value="1" min="1">
            </div>
            <button id="calcBtn" class="btn btn-primary w-100">Подсчитать стоимоcть</button>

            <div id="result" class="text-center"></div>
        </div>
    </div>
    <script>
        const productSelect = document.getElementById('productSelect');
        const quantityInput = document.getElementById('quantityInput');
        const calcBtn = document.getElementById('calcBtn');
        const resultDiv = document.getElementById('result');

        calcBtn.addEventListener('click', function () {
            const price = Number(productSelect.value);
            const quantity = Number(quantityInput.value);

            if (price === 0 || quantity<1 || isNaN(quantity)) {
                resultDiv.textContent = "Пожалуйста, выберите товар.";
                resultDiv.style.color = "red";
                return;
            }
            const total = price * quantity;

            resultDiv.textContent = "Итоговая стоимость: " + total + " руб.";
            resultDiv.style.color = "#0d6efd"
        });
    </script>
</body>
</html>
