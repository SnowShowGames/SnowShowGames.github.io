<!DOCTYPE html>

<html>

  <head>
    <title>Ширина, выравнивание, float</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
#main-aside-wrapper {
  flex-direction: column;
  display: flex;
}
main, aside {
  background-color: #ddd;
  margin: 10px;
  padding: 10px;
}
aside {
  flex: 1;
  order: 1;
}
main {
  flex: 3;
  order: 2;
}
@media screen and (min-width: 800px) {
  #main-aside-wrapper {
    flex-direction: row;
  }
}

   </style>
  </head>


  <body>
    <div id="main-aside-wrapper">
      <main>
        <h1>Главный контент</h1>
        <p>Вторая строка</p>
      </main>
      <aside>Сайдбар</aside>
    </div>
  </body>

</html>
